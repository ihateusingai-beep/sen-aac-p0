<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>SEN AAC P0 · 4選1 demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden; overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Noto Sans TC", sans-serif;
      background: #c5d0dc; color: #1a2330;
    }
    .stage { height: 100dvh; width: 100vw; display: grid; place-items: center; padding: 6px; }
    .app {
      width: min(100vw - 8px, 1180px);
      height: min(100dvh - 8px, 780px);
      aspect-ratio: 16/10; max-height: calc(100dvh - 8px);
      display: grid; grid-template-rows: auto 1fr;
      background: #f4f7fb; border: 3px solid #2c3e50; border-radius: 14px;
      overflow: hidden; box-shadow: 0 10px 32px rgba(0,0,0,.18);
      position: relative;
    }
    .msg-bar {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: stretch;
      padding: 8px 10px; background: #fff; border-bottom: 3px solid #2b6cb0; min-height: 80px;
    }
    .msg-strip {
      display: flex; align-items: center; gap: 8px; overflow-x: auto;
      padding: 4px 8px; background: #eef4fb; border: 2px solid #b8cce3; border-radius: 12px; min-height: 64px;
    }
    .msg-empty { color: #6b7c90; font-weight: 800; font-size: 1rem; }
    .chip {
      flex: 0 0 auto; width: 64px; height: 64px; border-radius: 12px;
      border: 2px solid #2b6cb0; background: #fff; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .chip img { width: 100%; height: 70%; object-fit: cover; }
    .chip span { font-size: .7rem; font-weight: 900; line-height: 1; }
    .actions { display: flex; gap: 8px; align-items: stretch; }
    .btn {
      border: 0; border-radius: 14px; font-weight: 900; font-size: 1.15rem;
      min-width: 64px; padding: 0 14px; cursor: pointer; touch-action: manipulation;
    }
    .btn:active { transform: scale(.97); }
    .btn-speak {
      background: #1f7a4c; color: #fff;
      min-width: 120px; font-size: 1.75rem; padding: 0 22px;
      box-shadow: 0 3px 0 #155c39;
    }
    .btn-del { background: #ffe8a3; color: #5a4300; min-width: 64px; font-size: 1.35rem; opacity: .92; }
    .btn-clr {
      background: #ffd0d0; color: #7a1f1f; min-width: 64px; font-size: 1.05rem; opacity: .9;
      position: relative;
    }
    .btn-clr.holding { background: #e53e3e; color: #fff; }
    .btn-clr .holdbar {
      position: absolute; left: 0; bottom: 0; height: 5px; width: 0%;
      background: #fff; border-radius: 0 0 14px 14px; pointer-events: none;
    }
    .body { display: grid; grid-template-columns: 108px 1fr; min-height: 0; }
    .side {
      display: flex; flex-direction: column; gap: 6px; padding: 8px 5px;
      background: #e8eef5; border-right: 3px solid #c5d0dc; min-height: 0;
    }
    .tabs {
      flex: 1; display: flex; flex-direction: column; gap: 8px;
      overflow: hidden;
      min-height: 0;
    }
    .tab {
      border: 3px solid #9aafc4; background: #f0f4f8; border-radius: 14px;
      padding: 6px 2px 4px; font-size: .9rem; font-weight: 900; cursor: pointer;
      text-align: center; min-height: 0; color: #1a2330;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      flex: 1 1 0;
    }
    .tab .ico { font-size: 1.35rem; line-height: 1; }
    .tab .tl { font-size: .78rem; line-height: 1.05; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .tab.on { color: #fff; border-color: #1a2330; }
    .side-foot {
      flex: 0 0 auto;
      display: flex; flex-direction: column; gap: 6px; align-items: stretch;
      width: 100%;
    }
    /* pager 喺主區底，唔塞左欄 */
    .pager-bar {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center; gap: 14px;
      padding: 6px 8px 2px;
    }
    .pg-btn {
      width: 72px; height: 56px; border-radius: 14px; border: 3px solid #2c3e50;
      background: #fff; font-size: 1.6rem; font-weight: 900; cursor: pointer;
      flex: 0 0 auto;
    }
    .pg-btn:disabled { opacity: .35; }
    .pg-mid { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px; }
    .pg-label { text-align: center; font-weight: 900; font-size: 1.05rem; }
    .pg-dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; max-width: 120px; }
    .pg-dots i {
      width: 11px; height: 11px; border-radius: 50%; background: #b0c0d0; display: block;
    }
    .pg-dots i.on { background: #2b6cb0; }
    .lock {
      display: none;
      width: 100%; min-height: 40px; border-radius: 10px; border: 2px solid #2b6cb0;
      background: #e3f0ff; color: #1e4e82; font-weight: 800; font-size: .72rem;
      cursor: pointer; padding: 6px 4px; line-height: 1.2;
    }
    .lock.show { display: block; }
    .lock.on { border-color: #1f7a4c; background: #d9f5e6; color: #155c39; }
    .teacher-box {
      display: none; width: 100%; padding: 6px; background: #fff;
      border: 2px solid #2b6cb0; border-radius: 10px;
      max-height: 36vh; overflow-y: auto;
    }
    .teacher-box.show { display: block; }
    .teacher-box .ttl { font-size: .7rem; font-weight: 800; color: #2b6cb0; text-align: center; margin-bottom: 4px; }
    .row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .mini {
      border: 2px solid #9aafc4; background: #f0f4f8; border-radius: 8px;
      padding: 8px 2px; font-size: .78rem; font-weight: 900; cursor: pointer;
    }
    .mini.on { background: #1f7a4c; border-color: #155c39; color: #fff; }
    .mini.wide { grid-column: 1 / -1; }
    .grid-wrap { padding: 8px 10px 6px; min-height: 0; display: flex; flex-direction: column; gap: 2px; }
    .hint {
      text-align: center; font-size: .75rem; color: #5a6b7d; font-weight: 700;
      display: none; /* 學生藏 */
    }
    .hint.show { display: block; }
    .grid { flex: 1; display: grid; gap: 12px; min-height: 0; }
    .cell {
      display: grid; grid-template-rows: 1fr auto;
      background: #1a2330; border: 4px solid #2c3e50; border-radius: 16px; cursor: pointer;
      touch-action: manipulation; min-height: 0; padding: 0; position: relative;
      overflow: hidden;
      box-shadow: 0 2px 0 #c5d0dc; transition: transform .08s, box-shadow .08s, border-color .08s;
    }
    .cell:active, .cell.sel {
      border-color: #1f7a4c;
      box-shadow: 0 0 0 4px rgba(31,122,76,.35); transform: scale(.985);
    }
    .cell .pic {
      width: 100%; height: 100%; min-height: 0; margin: 0; border: 0; border-radius: 0;
      background: #dfe6ee; overflow: hidden; align-self: stretch;
    }
    .cell .pic img {
      width: 100%; height: 100%; object-fit: cover; object-position: center; display: block;
    }
    .cell .lab {
      font-size: clamp(1.15rem, 2.4vw, 1.9rem); font-weight: 900;
      text-align: center; line-height: 1.15; padding: 8px 6px 10px;
      background: #fff; color: #1a2330; border-top: 2px solid #c5d0dc; width: 100%;
    }
    .grid[data-preset="1x2"] .lab { font-size: clamp(1.6rem, 3.2vw, 2.5rem); padding: 12px 8px; }
    .grid[data-preset="2x4"] .lab,
    .grid[data-preset="4x4"] .lab { font-size: clamp(.85rem, 1.5vw, 1.15rem); padding: 4px 2px 6px; }
    .grid[data-preset="1x2"] .cell {
      grid-template-rows: none; grid-template-columns: 1.35fr 0.65fr;
    }
    .grid[data-preset="1x2"] .cell .lab {
      border-top: 0; border-left: 2px solid #c5d0dc;
      display: grid; place-items: center; padding: 12px;
    }
    .banner {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      background: #1a2330; color: #fff; padding: 10px 16px; border-radius: 12px;
      font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30;
      max-width: 90vw; text-align: center;
    }
    .banner.show { opacity: 1; }
    .flash {
      position: fixed; inset: 0; pointer-events: none; z-index: 25;
      background: rgba(31,122,76,.12); opacity: 0; transition: opacity .15s;
    }
    .flash.on { opacity: 1; }
    .tag {
      display: none; /* 學生藏 */
      position: fixed; top: 6px; right: 8px; z-index: 40;
      background: #1f7a4c; color: #fff; font-size: .68rem; font-weight: 800;
      padding: 4px 8px; border-radius: 6px;
    }
    .tag.show { display: block; }
    .who {
      position: fixed; top: 6px; left: 8px; z-index: 40;
      display: none; /* 學生藏；老師模式顯示 */
      align-items: center; gap: 8px;
      background: rgba(255,255,255,.95); border: 2px solid #2c3e50;
      border-radius: 999px; padding: 4px 10px 4px 4px;
      font-weight: 900; font-size: .85rem;
    }
    .who.show { display: flex; }
    .who img {
      width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
      border: 2px solid #2b6cb0; background: #e8eef5;
    }
    .who.guest img { display: none; }
    .who .dot {
      width: 36px; height: 36px; border-radius: 50%; background: #9aafc4;
      display: grid; place-items: center; font-size: .75rem; color: #fff;
    }
    .who.guest .dot { display: grid; }
    .who:not(.guest) .dot { display: none; }
    /* 隱形老師入口：四角 */
    .secret {
      position: fixed; z-index: 45; width: 48px; height: 48px;
      background: transparent; border: 0; padding: 0;
    }
    .secret.tl { top: 0; left: 0; }
    .secret.tr { top: 0; right: 0; }
    .secret.bl { bottom: 0; left: 0; }
    .secret.br { bottom: 0; right: 0; }
    /* 老師入口：細 ⚙️ 長按（學生唔易誤觸） */
    .gear {
      position: fixed; z-index: 46;
      right: 10px; bottom: 10px;
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid rgba(44,62,80,.25);
      background: rgba(255,255,255,.55);
      color: rgba(26,35,48,.45);
      font-size: 1.25rem; cursor: pointer;
      display: grid; place-items: center;
      backdrop-filter: blur(2px);
      touch-action: manipulation;
      overflow: hidden;
    }
    .gear:active, .gear.holding {
      background: rgba(43,108,176,.9); color: #fff; border-color: #2b6cb0;
    }
    .gear .gbar {
      position: absolute; left: 0; bottom: 0; height: 4px; width: 0%;
      background: #fff; pointer-events: none;
    }
    body.teacher-on .gear { display: none; }
    .overlay {
      display: none; position: fixed; inset: 0; z-index: 60;
      background: rgba(26,35,48,.88); place-items: center; padding: 16px;
    }
    .overlay.show { display: grid; }
    .panel {
      width: min(920px, 96vw); max-height: 90dvh; overflow: auto;
      background: #f4f7fb; border-radius: 16px; border: 3px solid #fff;
      padding: 16px; box-shadow: 0 16px 48px rgba(0,0,0,.35);
    }
    .panel h2 { font-size: 1.25rem; margin-bottom: 10px; text-align: center; }
    .panel .sub { text-align: center; color: #5a6b7d; font-weight: 700; margin-bottom: 12px; font-size: .9rem; }
    .pin-row { display: flex; gap: 8px; justify-content: center; margin: 12px 0; flex-wrap: wrap; }
    .pin-row input {
      font-size: 1.4rem; letter-spacing: .2em; text-align: center;
      padding: 10px 14px; border-radius: 12px; border: 3px solid #2b6cb0;
      width: min(220px, 70vw); font-weight: 900;
    }
    .pin-row button, .panel .xbtn {
      border: 0; border-radius: 12px; background: #2b6cb0; color: #fff;
      font-weight: 900; font-size: 1.1rem; padding: 10px 18px; cursor: pointer;
    }
    .panel .xbtn.ghost { background: #e8eef5; color: #1a2330; border: 2px solid #9aafc4; }
    .panel .xbtn.ok { background: #1f7a4c; font-size: 1.25rem; min-width: 140px; }
    .profiles {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px; margin-top: 8px;
    }
    .prof {
      border: 4px solid #2c3e50; border-radius: 16px; background: #fff;
      padding: 8px; cursor: pointer; text-align: center;
      display: flex; flex-direction: column; gap: 8px; align-items: center;
    }
    .prof:active, .prof.on { border-color: #1f7a4c; box-shadow: 0 0 0 3px rgba(31,122,76,.3); }
    .prof img {
      width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; background: #eef2f6;
    }
    .prof .nm { font-weight: 900; font-size: 1.1rem; }
    .prof .meta { font-size: .75rem; color: #5a6b7d; font-weight: 700; }
    .prof.guest-card { background: #e8eef5; justify-content: center; min-height: 160px; }
    .prof.guest-card .big { font-size: 2.2rem; }
    .panel-actions { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
    /* 自訂詞彙 */
    .vocab-cat { margin: 12px 0; }
    .vocab-cat h3 {
      font-size: 1rem; margin-bottom: 8px; padding: 6px 10px; border-radius: 8px; color: #fff;
    }
    .vocab-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px;
    }
    .vcell {
      border: 3px solid #9aafc4; border-radius: 12px; background: #fff; padding: 6px;
      cursor: pointer; text-align: center; position: relative;
    }
    .vcell.on { border-color: #1f7a4c; background: #eaf8f0; }
    .vcell.off { opacity: .45; border-style: dashed; }
    .vcell img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: #eef2f6; }
    .vcell .vl { font-weight: 900; font-size: .9rem; margin-top: 4px; }
    .vcell .badge {
      position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%;
      display: grid; place-items: center; font-weight: 900; font-size: .85rem; color: #fff;
    }
    .vcell.on .badge { background: #1f7a4c; }
    .vcell.off .badge { background: #a0aec0; }
    .rotate-hint {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: rgba(26,35,48,.92); color: #fff; place-items: center;
      text-align: center; padding: 24px; font-size: 1.35rem; font-weight: 800;
    }
    @media (orientation: portrait) and (max-width: 900px) {
      .rotate-hint { display: grid; }
      .app { filter: blur(2px); pointer-events: none; }
    }
  </style>
</head>
<body>
  <button type="button" class="secret tl" id="secTL" aria-label=""></button>
  <button type="button" class="secret tr" id="secTR" aria-label=""></button>
  <button type="button" class="secret bl" id="secBL" aria-label=""></button>
  <button type="button" class="secret br" id="secBR" aria-label=""></button>
  <button type="button" class="gear" id="gearBtn" aria-label="老師設定（長按）">⚙️<span class="gbar" id="gearBar"></span></button>

  <div class="who guest" id="who">
    <span class="dot">訪</span>
    <img id="whoImg" alt="" />
    <span id="whoLabel">訪客</span>
  </div>
  <div class="tag" id="tag">老師模式</div>
  <div class="rotate-hint">請將裝置轉橫（iPad 橫向）</div>
  <div class="flash" id="flash"></div>

  <div class="overlay" id="pinOverlay">
    <div class="panel">
      <h2>老師密碼</h2>
      <div class="sub">過閘先設定／揀學生 · 否則只用訪客</div>
      <div class="pin-row">
        <input id="pinInput" type="password" inputmode="numeric" maxlength="12" placeholder="••••••" autocomplete="off" />
        <button type="button" id="pinOk">確認</button>
      </div>
      <div class="panel-actions">
        <button type="button" class="xbtn ghost" id="pinCancel">取消</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="profileOverlay">
    <div class="panel">
      <h2>揀學生</h2>
      <div class="sub">撳真相片切換 · 訪客無個人設定</div>
      <div class="profiles" id="profileWall"></div>
      <div class="panel-actions">
        <button type="button" class="xbtn ok" id="profileClose">得</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="vocabOverlay">
    <div class="panel">
      <h2>自訂顯示詞彙</h2>
      <div class="sub" id="vocabSub">撳格開關 · 關咗學生睇唔到 · 跟而家 profile 存</div>
      <div class="panel-actions" style="margin-top:0;margin-bottom:8px">
        <button type="button" class="xbtn ghost" id="vocabAllOn">全部開</button>
        <button type="button" class="xbtn ghost" id="vocabAllOff">全部關</button>
      </div>
      <div id="vocabEditor"></div>
      <div class="panel-actions">
        <button type="button" class="xbtn ok" id="vocabDone">得</button>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="app">
      <header class="msg-bar">
        <div class="msg-strip" id="msg"><span class="msg-empty" id="msgEmpty">撳大格…</span></div>
        <div class="actions">
          <button type="button" class="btn btn-speak" id="btnSpeak">講</button>
          <button type="button" class="btn btn-del" id="btnDel">⌫</button>
          <button type="button" class="btn btn-clr" id="btnClr">清<span class="holdbar" id="clrBar"></span></button>
        </div>
      </header>
      <div class="body">
        <aside class="side">
          <div class="tabs" id="tabs"></div>
          <div class="side-foot">
            <button type="button" class="lock" id="lock">🔓 返學生</button>
            <div class="teacher-box" id="teacherBox">
              <div class="ttl">PROFILE</div>
              <div class="row-btns">
                <button type="button" class="mini" id="btnPickProfile">揀學生</button>
                <button type="button" class="mini" id="btnGuest">訪客</button>
              </div>
              <div class="ttl" style="margin-top:6px">DISPLAY</div>
              <div class="row-btns" id="dispBtns"></div>
              <div class="ttl" style="margin-top:6px">出聲</div>
              <div class="row-btns">
                <button type="button" class="mini" id="modeCompose">組句後講</button>
                <button type="button" class="mini" id="modeInstant">即點即講</button>
              </div>
              <div class="ttl" style="margin-top:6px">詞彙</div>
              <div class="row-btns">
                <button type="button" class="mini wide" id="btnVocab">自訂詞</button>
              </div>
              <div class="row-btns" style="margin-top:6px">
                <button type="button" class="mini wide" id="btnLockDone">返學生</button>
              </div>
            </div>
          </div>
        </aside>
        <main class="grid-wrap">
          <div class="hint" id="hint">P0</div>
          <div class="grid" id="grid" data-preset="2x2"></div>
          <div class="pager-bar">
            <button type="button" class="pg-btn" id="prev" aria-label="上一頁">◀</button>
            <div class="pg-mid">
              <div class="pg-label" id="pageLabel">1/1</div>
              <div class="pg-dots" id="pageDots"></div>
            </div>
            <button type="button" class="pg-btn" id="next" aria-label="下一頁">▶</button>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="banner" id="banner"></div>

  <script>
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("selectstart", e => e.preventDefault());

    const PRESETS = {
      "1x2": { rows: 1, cols: 2, label: "2選1" },
      "2x2": { rows: 2, cols: 2, label: "4選1" },
      "2x4": { rows: 2, cols: 4, label: "8選1" },
      "4x4": { rows: 4, cols: 4, label: "16選1" }
    };

    const TAB_ICON = {
      need: "🙋", place: "📍", routine: "✋", social: "👋",
      people: "👤", ask: "❓", feel: "😊", calm: "🌿", want: "💬",
      say: "💬", help: "🆘"
    };

    let board = null;
    let generalBoard = null;
    let personalBoards = {};
    let profilesData = null;
    let preset = "2x2";
    let teacher = false;
    let gateOk = false;
    let instantSpeak = true;
    let cat = null;
    let page = 0;
    let sentence = [];
    let activeProfileId = "guest";
    let hiddenIds = new Set(); // 當前 profile 隱藏嘅 cell id

    const PIN_SALT = "tkops-aac-v1";
    const PIN_HASH = "6cecd5c6eafcace439d4d48ea9c2ce5def4d253aa2ffb72007cb994cd3853444";

    const PERSONAL_FILES = {
      "demo-a": "data/personal-demo-calm.json",
      "personal-demo-calm": "data/personal-demo-calm.json"
    };

    const grid = document.getElementById("grid");
    const tabs = document.getElementById("tabs");
    const msg = document.getElementById("msg");
    const msgEmpty = document.getElementById("msgEmpty");
    const pageLabel = document.getElementById("pageLabel");
    const pageDots = document.getElementById("pageDots");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const banner = document.getElementById("banner");
    const hint = document.getElementById("hint");
    const tag = document.getElementById("tag");
    const lockBtn = document.getElementById("lock");
    const teacherBox = document.getElementById("teacherBox");
    const dispBtns = document.getElementById("dispBtns");
    const flash = document.getElementById("flash");
    const modeCompose = document.getElementById("modeCompose");
    const modeInstant = document.getElementById("modeInstant");
    const who = document.getElementById("who");
    const whoImg = document.getElementById("whoImg");
    const whoLabel = document.getElementById("whoLabel");
    const pinOverlay = document.getElementById("pinOverlay");
    const profileOverlay = document.getElementById("profileOverlay");
    const vocabOverlay = document.getElementById("vocabOverlay");
    const pinInput = document.getElementById("pinInput");
    const profileWall = document.getElementById("profileWall");
    const vocabEditor = document.getElementById("vocabEditor");
    const vocabSub = document.getElementById("vocabSub");
    const btnClr = document.getElementById("btnClr");
    const clrBar = document.getElementById("clrBar");

    async function sha256Hex(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function hideKey() {
      return "aac_hidden_" + (board?.id || "general") + "_" + activeProfileId;
    }

    function loadHidden() {
      hiddenIds = new Set();
      try {
        const raw = localStorage.getItem(hideKey());
        if (raw) JSON.parse(raw).forEach(id => hiddenIds.add(id));
      } catch (_) {}
    }

    function saveHidden() {
      try {
        localStorage.setItem(hideKey(), JSON.stringify([...hiddenIds]));
      } catch (_) {}
    }

    function currentProfile() {
      if (!profilesData || activeProfileId === "guest") {
        return profilesData?.guest || { id: "guest", label: "訪客", displayPreset: "2x2" };
      }
      return profilesData.profiles.find(p => p.id === activeProfileId) || profilesData.guest;
    }

    async function applyProfile(id) {
      activeProfileId = id || "guest";
      const p = currentProfile();
      const isGuest = activeProfileId === "guest";
      who.classList.toggle("guest", isGuest);
      whoLabel.textContent = p.label || "訪客";
      if (!isGuest && p.avatarPath) {
        whoImg.src = p.avatarPath;
        whoImg.alt = p.label;
      } else {
        whoImg.removeAttribute("src");
      }
      if (p.displayPreset && PRESETS[p.displayPreset]) preset = p.displayPreset;
      else if (isGuest && profilesData?.defaultDisplayPreset) preset = profilesData.defaultDisplayPreset;
      page = 0;
      cat = null;
      sentence = [];

      const pbId = p.personalBoardId || activeProfileId;
      if (!isGuest && personalBoards[pbId]) board = personalBoards[pbId];
      else if (!isGuest && PERSONAL_FILES[activeProfileId]) {
        try {
          const r = await fetch(PERSONAL_FILES[activeProfileId]);
          const pb = await r.json();
          personalBoards[pb.id || pbId] = pb;
          board = pb;
        } catch (e) {
          console.warn(e);
          board = generalBoard;
        }
      } else board = generalBoard;

      loadHidden();
      try {
        if (!isGuest) sessionStorage.setItem("aac_active_profile", activeProfileId);
        else sessionStorage.removeItem("aac_active_profile");
      } catch (_) {}
      render();
      toast(isGuest ? "訪客" : (p.label + " · " + (board?.title || "")));
    }

    function renderWhoOnly() {
      const p = currentProfile();
      const isGuest = activeProfileId === "guest";
      who.classList.toggle("guest", isGuest);
      whoLabel.textContent = p.label || "訪客";
      if (!isGuest && p.avatarPath) whoImg.src = p.avatarPath;
    }

    function openPin() {
      pinOverlay.classList.add("show");
      pinInput.value = "";
      setTimeout(() => pinInput.focus(), 50);
    }
    function closePin() { pinOverlay.classList.remove("show"); }

    function openProfileWall() {
      if (!gateOk) { openPin(); return; }
      renderProfileWall();
      profileOverlay.classList.add("show");
    }
    function closeProfileWall() { profileOverlay.classList.remove("show"); }

    function renderProfileWall() {
      if (!profilesData) return;
      profileWall.innerHTML = "";
      const g = document.createElement("button");
      g.type = "button";
      g.className = "prof guest-card" + (activeProfileId === "guest" ? " on" : "");
      g.innerHTML = `<div class="big">👤</div><div class="nm">訪客</div><div class="meta">共用板</div>`;
      g.onclick = () => { applyProfile("guest"); closeProfileWall(); };
      profileWall.appendChild(g);

      profilesData.profiles.forEach(p => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "prof" + (activeProfileId === p.id ? " on" : "");
        const disp = PRESETS[p.displayPreset]?.label || p.displayPreset || "";
        const img = p.avatarPath
          ? `<img src="${p.avatarPath}" alt="${p.label}">`
          : `<div class="big">🙂</div>`;
        b.innerHTML = `${img}<div class="nm">${p.label}</div><div class="meta">${disp}</div>`;
        b.onclick = () => { applyProfile(p.id); closeProfileWall(); };
        profileWall.appendChild(b);
      });
    }

    function toast(t) {
      banner.textContent = t;
      banner.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => banner.classList.remove("show"), 1400);
    }

    function flashOk() {
      flash.classList.add("on");
      setTimeout(() => flash.classList.remove("on"), 180);
    }

    function pageSize() {
      return PRESETS[preset].rows * PRESETS[preset].cols;
    }

    function visibleCats() {
      return [...board.categories]
        .sort((a, b) => a.order - b.order)
        .filter(c => cellsOfCat(c.id, true).length > 0);
    }

    function cellsOfCat(id, onlyVisible = true) {
      return board.cells
        .filter(c => c.category === id)
        .filter(c => !onlyVisible || !hiddenIds.has(c.id))
        .sort((a, b) => a.order - b.order);
    }

    function pagesOf(items) {
      const n = pageSize();
      const out = [];
      for (let i = 0; i < items.length; i += n) out.push(items.slice(i, i + n));
      return out.length ? out : [[]];
    }

    function speakText(text) {
      return new Promise((resolve) => {
        if (!window.speechSynthesis) {
          toast("呢部機無 TTS");
          resolve();
          return;
        }
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "zh-HK";
        const voices = window.speechSynthesis.getVoices();
        const v = voices.find(x => /zh-HK|yue/i.test(x.lang) || /Hong Kong|Yue/i.test(x.name))
          || voices.find(x => /zh-TW|zh-CN|zh/i.test(x.lang));
        if (v) u.voice = v;
        u.rate = 0.92;
        u.onend = () => resolve();
        u.onerror = () => resolve();
        window.speechSynthesis.speak(u);
      });
    }

    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    function renderMsg() {
      [...msg.querySelectorAll(".chip")].forEach(n => n.remove());
      if (!sentence.length) { msgEmpty.style.display = ""; return; }
      msgEmpty.style.display = "none";
      sentence.forEach(c => {
        const d = document.createElement("div");
        d.className = "chip";
        d.innerHTML = `<img src="${c.image}" alt=""><span>${c.label}</span>`;
        msg.appendChild(d);
      });
    }

    function renderDisp() {
      dispBtns.innerHTML = "";
      Object.keys(PRESETS).forEach(k => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "mini" + (k === preset ? " on" : "");
        b.textContent = PRESETS[k].label;
        b.onclick = () => {
          if (!teacher) return;
          preset = k; page = 0; render(); toast("Display → " + PRESETS[k].label);
        };
        dispBtns.appendChild(b);
      });
      modeCompose.classList.toggle("on", !instantSpeak);
      modeInstant.classList.toggle("on", instantSpeak);
    }

    function renderTabs() {
      const cats = visibleCats();
      if (!cats.length) {
        tabs.innerHTML = "";
        return;
      }
      if (!cat || !cats.find(c => c.id === cat)) cat = cats[0].id;
      tabs.innerHTML = "";
      // 中度：最多同時顯示 4 個 tab；多出嘅用「更多」
      const MAX = 4;
      let show = cats;
      let more = [];
      if (cats.length > MAX) {
        const activeIdx = Math.max(0, cats.findIndex(c => c.id === cat));
        // 保證當前 cat 喺可見 4 個入面
        if (activeIdx < MAX - 1) {
          show = cats.slice(0, MAX - 1);
          more = cats.slice(MAX - 1);
        } else {
          show = cats.slice(0, MAX - 2).concat(cats[activeIdx]);
          more = cats.filter(c => !show.includes(c));
        }
      }
      show.forEach(c => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "tab" + (c.id === cat ? " on" : "");
        const ico = TAB_ICON[c.id] || "📌";
        b.innerHTML = `<span class="ico">${ico}</span><span class="tl">${c.label}</span>`;
        if (c.id === cat) b.style.background = c.color || "#2b6cb0";
        else b.style.background = "#f0f4f8";
        b.onclick = () => { cat = c.id; page = 0; render(); };
        tabs.appendChild(b);
      });
      if (more.length) {
        const m = document.createElement("button");
        m.type = "button";
        m.className = "tab";
        m.innerHTML = `<span class="ico">⋯</span><span class="tl">更多</span>`;
        m.style.background = "#dfe6ee";
        m.onclick = () => {
          // 簡單：轉去 more 第一個
          cat = more[0].id; page = 0; render();
          toast("類別：" + more.map(x => x.label).join("、"));
        };
        tabs.appendChild(m);
      }
    }

    function renderGrid() {
      const items = cellsOfCat(cat);
      const pages = pagesOf(items);
      if (page >= pages.length) page = Math.max(0, pages.length - 1);
      const cells = pages[page] || [];
      const conf = PRESETS[preset];
      grid.style.gridTemplateColumns = `repeat(${conf.cols}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${conf.rows}, 1fr)`;
      grid.dataset.preset = preset;
      grid.innerHTML = "";

      cells.forEach(cell => {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "cell";
        el.innerHTML = `<div class="pic"><img src="${cell.image}" alt="${cell.label}" loading="eager"></div><div class="lab">${cell.label}</div>`;
        el.addEventListener("click", () => {
          el.classList.add("sel");
          setTimeout(() => el.classList.remove("sel"), 200);
          flashOk();
          if (sentence.length >= 8) sentence.shift();
          sentence.push(cell);
          renderMsg();
          if (instantSpeak) speakText(cell.speak || cell.label);
        });
        grid.appendChild(el);
      });

      const need = conf.rows * conf.cols;
      while (grid.children.length < need) {
        const f = document.createElement("div");
        f.className = "cell"; f.style.visibility = "hidden"; f.setAttribute("aria-hidden", "true");
        grid.appendChild(f);
      }

      pageLabel.textContent = `${page + 1}/${pages.length}`;
      prev.disabled = page <= 0;
      next.disabled = page >= pages.length - 1;
      pageDots.innerHTML = "";
      pages.forEach((_, i) => {
        const d = document.createElement("i");
        if (i === page) d.classList.add("on");
        pageDots.appendChild(d);
      });

      if (teacher) {
        hint.classList.add("show");
        hint.textContent = `${whoLabel.textContent} · ${PRESETS[preset].label} · 隱 ${hiddenIds.size} 詞`;
      } else {
        hint.classList.remove("show");
      }
    }

    function renderChrome() {
      lockBtn.classList.toggle("show", teacher);
      lockBtn.classList.toggle("on", teacher);
      teacherBox.classList.toggle("show", teacher);
      tag.classList.toggle("show", teacher);
      who.classList.toggle("show", teacher);
      document.body.classList.toggle("teacher-on", teacher);
    }

    function render() {
      if (!board) return;
      renderTabs();
      renderDisp();
      renderGrid();
      renderMsg();
      renderWhoOnly();
      renderChrome();
    }

    function enterTeacher() {
      if (!gateOk) { openPin(); return; }
      teacher = true;
      document.body.classList.add("teacher-on");
      render();
      toast("老師模式");
    }

    function exitTeacher() {
      teacher = false;
      document.body.classList.remove("teacher-on");
      closeProfileWall();
      closeVocab();
      render();
      toast("返學生模式");
    }

    // —— 隱形入口：5 下任意角（2 秒內）——
    let secretTaps = 0;
    let secretTimer = null;
    function secretHit() {
      if (teacher) return;
      secretTaps++;
      clearTimeout(secretTimer);
      secretTimer = setTimeout(() => { secretTaps = 0; }, 2000);
      if (secretTaps >= 5) {
        secretTaps = 0;
        enterTeacher();
      }
    }
    ["secTL", "secTR", "secBL", "secBR"].forEach(id => {
      document.getElementById(id).addEventListener("click", secretHit);
    });

    // —— 右下 ⚙️ 長按 1.2s ——
    const gearBtn = document.getElementById("gearBtn");
    const gearBar = document.getElementById("gearBar");
    let gearRaf = null;
    let gearT0 = 0;
    function gearDown(e) {
      if (teacher) return;
      e.preventDefault();
      gearT0 = Date.now();
      gearBtn.classList.add("holding");
      gearBar.style.width = "0%";
      const tick = () => {
        const p = Math.min(1, (Date.now() - gearT0) / 1200);
        gearBar.style.width = (p * 100) + "%";
        if (p >= 1) {
          gearUp(true);
          enterTeacher();
          return;
        }
        gearRaf = requestAnimationFrame(tick);
      };
      gearRaf = requestAnimationFrame(tick);
    }
    function gearUp(done) {
      gearBtn.classList.remove("holding");
      gearBar.style.width = "0%";
      if (gearRaf) cancelAnimationFrame(gearRaf);
      gearRaf = null;
      if (!done && gearT0 && Date.now() - gearT0 < 1200) {
        toast("長按 ⚙️ 入老師設定");
      }
      gearT0 = 0;
    }
    gearBtn.addEventListener("pointerdown", gearDown);
    gearBtn.addEventListener("pointerup", () => gearUp(false));
    gearBtn.addEventListener("pointerleave", () => gearUp(false));
    gearBtn.addEventListener("pointercancel", () => gearUp(false));

    prev.onclick = () => { if (page > 0) { page--; renderGrid(); } };
    next.onclick = () => {
      const pages = pagesOf(cellsOfCat(cat));
      if (page < pages.length - 1) { page++; renderGrid(); }
    };
    document.getElementById("btnDel").onclick = () => { sentence.pop(); renderMsg(); };

    // 清：長按 0.7s 先清
    let clrTimer = null;
    let clrStart = 0;
    function clrDown(e) {
      e.preventDefault();
      clrStart = Date.now();
      btnClr.classList.add("holding");
      clrBar.style.width = "0%";
      const tick = () => {
        const p = Math.min(1, (Date.now() - clrStart) / 700);
        clrBar.style.width = (p * 100) + "%";
        if (p >= 1) {
          sentence = [];
          renderMsg();
          flashOk();
          toast("已清空");
          clrUp();
          return;
        }
        clrTimer = requestAnimationFrame(tick);
      };
      clrTimer = requestAnimationFrame(tick);
    }
    function clrUp() {
      btnClr.classList.remove("holding");
      clrBar.style.width = "0%";
      if (clrTimer) cancelAnimationFrame(clrTimer);
      clrTimer = null;
      if (Date.now() - clrStart < 700 && clrStart) {
        toast("長按「清」先清空");
      }
      clrStart = 0;
    }
    btnClr.addEventListener("pointerdown", clrDown);
    btnClr.addEventListener("pointerup", clrUp);
    btnClr.addEventListener("pointerleave", clrUp);
    btnClr.addEventListener("pointercancel", clrUp);

    document.getElementById("btnSpeak").onclick = async () => {
      if (!sentence.length) { toast("未有詞"); return; }
      const t = sentence.map(c => c.speak || c.label).join("，");
      flashOk();
      await speakText(t);
    };

    lockBtn.onclick = () => {
      if (teacher) exitTeacher();
      else enterTeacher();
    };

    document.getElementById("pinOk").onclick = async () => {
      const pin = pinInput.value.trim();
      if (!pin) { toast("請入密碼"); return; }
      const h = await sha256Hex(PIN_SALT + pin);
      if (h !== PIN_HASH) {
        toast("密碼錯");
        pinInput.value = "";
        pinInput.focus();
        return;
      }
      gateOk = true;
      try { sessionStorage.setItem("aac_gate_ok", "1"); } catch (_) {}
      closePin();
      teacher = true;
      render();
      toast("密碼 OK");
    };
    document.getElementById("pinCancel").onclick = () => { closePin(); };
    pinInput.addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("pinOk").click();
    });

    document.getElementById("btnPickProfile").onclick = () => openProfileWall();
    document.getElementById("btnGuest").onclick = () => applyProfile("guest");
    document.getElementById("profileClose").onclick = () => closeProfileWall();
    document.getElementById("btnLockDone").onclick = () => exitTeacher();

    modeCompose.onclick = () => {
      if (!teacher) return;
      instantSpeak = false;
      renderDisp();
      toast("組句後講");
    };
    modeInstant.onclick = () => {
      if (!teacher) return;
      instantSpeak = true;
      renderDisp();
      toast("一點即講");
    };

    // —— 自訂詞彙 ——
    function openVocab() {
      if (!teacher) return;
      vocabSub.textContent = `而家：${whoLabel.textContent} · 板：${board?.title || ""} · 撳格開關`;
      renderVocabEditor();
      vocabOverlay.classList.add("show");
    }
    function closeVocab() {
      vocabOverlay.classList.remove("show");
      page = 0;
      cat = null;
      render();
    }
    function renderVocabEditor() {
      vocabEditor.innerHTML = "";
      const cats = [...board.categories].sort((a, b) => a.order - b.order);
      cats.forEach(c => {
        const wrap = document.createElement("div");
        wrap.className = "vocab-cat";
        const h = document.createElement("h3");
        h.textContent = (TAB_ICON[c.id] || "") + " " + c.label;
        h.style.background = c.color || "#2b6cb0";
        wrap.appendChild(h);
        const g = document.createElement("div");
        g.className = "vocab-grid";
        board.cells.filter(x => x.category === c.id).sort((a, b) => a.order - b.order).forEach(cell => {
          const on = !hiddenIds.has(cell.id);
          const b = document.createElement("button");
          b.type = "button";
          b.className = "vcell " + (on ? "on" : "off");
          b.innerHTML = `<span class="badge">${on ? "✓" : "–"}</span><img src="${cell.image}" alt=""><div class="vl">${cell.label}</div>`;
          b.onclick = () => {
            if (hiddenIds.has(cell.id)) hiddenIds.delete(cell.id);
            else hiddenIds.add(cell.id);
            saveHidden();
            renderVocabEditor();
          };
          g.appendChild(b);
        });
        wrap.appendChild(g);
        vocabEditor.appendChild(wrap);
      });
    }
    document.getElementById("btnVocab").onclick = openVocab;
    document.getElementById("vocabDone").onclick = closeVocab;
    document.getElementById("vocabAllOn").onclick = () => {
      hiddenIds.clear();
      saveHidden();
      renderVocabEditor();
      toast("全部開");
    };
    document.getElementById("vocabAllOff").onclick = () => {
      board.cells.forEach(c => hiddenIds.add(c.id));
      saveHidden();
      renderVocabEditor();
      toast("全部關（記得再開幾格）");
    };

    // anti-swipe
    let touchStart = null;
    document.addEventListener("touchstart", e => {
      const t = e.changedTouches[0];
      touchStart = { x: t.clientX, y: t.clientY };
    }, { passive: true });
    document.addEventListener("touchend", e => {
      if (!touchStart) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStart.x;
      const dy = t.clientY - touchStart.y;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.2) {
        toast("用 ◀ ▶ 翻頁");
      }
      touchStart = null;
    }, { passive: true });
    document.addEventListener("wheel", e => {
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && Math.abs(e.deltaX) > 8) {
        e.preventDefault();
      }
    }, { passive: false });

    try {
      if (sessionStorage.getItem("aac_gate_ok") === "1") gateOk = true;
      const ap = sessionStorage.getItem("aac_active_profile");
      if (ap) activeProfileId = ap;
    } catch (_) {}

    Promise.all([
      fetch("data/board.p0.json").then(r => r.json()),
      fetch("data/profiles.json").then(r => r.json()),
      fetch("data/personal-demo-calm.json").then(r => r.json()).catch(() => null)
    ]).then(([b, p, chanBoard]) => {
      generalBoard = b;
      board = b;
      profilesData = p;
      if (chanBoard) {
        personalBoards[chanBoard.id || "personal-demo-calm"] = chanBoard;
        personalBoards["demo-a"] = chanBoard;
      }
      if (p.defaultDisplayPreset) preset = p.defaultDisplayPreset;
      loadHidden();
      return applyProfile(activeProfileId === "guest" ? "guest" : activeProfileId);
    }).catch(err => {
      toast("載入失敗（請用本地 server）");
      console.error(err);
    });
  </script>
</body>
</html>
